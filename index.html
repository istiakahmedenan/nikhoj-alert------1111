    <!-- Client-Side Guard Scripts -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress Vite HMR WebSocket connection closed errors in sandbox preview
        var origConsoleError = console.error;
        console.error = function() {
          try {
            var fullMsg = Array.prototype.slice.call(arguments).map(function(arg) {
              return typeof arg === 'object' ? (arg && arg.message ? arg.message : JSON.stringify(arg)) : String(arg);
            }).join(' ');
            if (fullMsg.includes('WebSocket') || fullMsg.includes('closed without opened') || fullMsg.includes('[vite]')) {
              return;
            }
          } catch (e) {}
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          try {
            var fullMsg = Array.prototype.slice.call(arguments).map(function(arg) {
              return typeof arg === 'object' ? (arg && arg.message ? arg.message : JSON.stringify(arg)) : String(arg);
            }).join(' ');
            if (fullMsg.includes('WebSocket') || fullMsg.includes('closed without opened') || fullMsg.includes('[vite]')) {
              return;
            }
          } catch (e) {}
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || reason)) ? String(reason.message || reason) : '';
            if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          } catch (e) {}
        }, true);

        window.addEventListener('error', function(event) {
          try {
            var msg = event && (event.message || (event.error && event.error.message)) ? String(event.message || event.error.message) : '';
            if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          } catch (e) {}
        }, true);
      })();
